---
name: CI

'on':
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_FORCE_COLOR: "1"
  PY_COLORS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validation:
    name: Repository Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
          python -m pip check

      - name: Show validation versions
        run: |
          python --version
          ansible --version
          ansible-lint --version
          yamllint --version
          ansible-galaxy collection list

      - name: Run repository validation
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/validate.sh

      - name: Validate sanitized inventory contract
        shell: bash
        run: |
          set -euo pipefail
          inventory_dir="$(mktemp -d)"
          trap 'rm -rf -- "$inventory_dir"' EXIT

          mkdir -p "$inventory_dir/group_vars/all"
          cp inventory/hosts.example.ini "$inventory_dir/hosts.example.ini"
          cp inventory/group_vars/all/vars.yml "$inventory_dir/group_vars/all/vars.yml"
          cp inventory/group_vars/all/vault.yml.example "$inventory_dir/group_vars/all/vault.yml"
          cp inventory/group_vars/ssh_ubuntu.yml "$inventory_dir/group_vars/ssh_ubuntu.yml"

          ansible-inventory -i "$inventory_dir/hosts.example.ini" --graph
          ansible-inventory -i "$inventory_dir/hosts.example.ini" --list > "$inventory_dir/inventory.json"

          INVENTORY_JSON="$inventory_dir/inventory.json" python - <<'PY'
          import json
          import os

          with open(os.environ["INVENTORY_JSON"], encoding="utf-8") as handle:
              inventory = json.load(handle)

          required_groups = {
              "common",
              "pasarguard_nodes",
              "ssh_ubuntu",
              "abuse_protected",
          }
          missing = sorted(required_groups - inventory.keys())
          if missing:
              raise SystemExit(f"Missing required inventory groups: {missing}")

          common_children = set(inventory["common"].get("children", []))
          if "pasarguard_nodes" not in common_children:
              raise SystemExit("common must include pasarguard_nodes as a child group")

          sample_nodes = set(inventory["pasarguard_nodes"].get("hosts", []))
          if not sample_nodes:
              raise SystemExit("pasarguard_nodes example group must contain sample hosts")

          print("Sanitized inventory contract is valid.")
          PY

      - name: Validate generated needrestart configuration
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf -- "$work_dir"' EXIT

          cat > "$work_dir/vars.yml" <<'YAML'
          ---
          security_updates_needrestart_mode: "a"
          security_updates_needrestart_protected_services:
            - systemd-networkd.service
            - networking.service
            - NetworkManager.service
          YAML

          template_args="src=roles/security_updates/templates/needrestart-security-updates.conf.j2"
          template_args+=" dest=$work_dir/needrestart.conf mode=0600"

          ansible_args=(
            localhost
            --connection=local
            -m ansible.builtin.template
            -a "$template_args"
            -e "@$work_dir/vars.yml"
          )
          ansible "${ansible_args[@]}"

          perl -c "$work_dir/needrestart.conf"
          grep -Fq "\$nrconf{restart} = 'a';" "$work_dir/needrestart.conf"
          grep -Fq "systemd\\-networkd\\.service" "$work_dir/needrestart.conf"
          grep -Fq "NetworkManager\\.service" "$work_dir/needrestart.conf"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - validation

    steps:
      - name: Require all CI jobs to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "Repository Validation result: $VALIDATION_RESULT"
            exit 1
          fi

          echo "All required CI checks passed."
