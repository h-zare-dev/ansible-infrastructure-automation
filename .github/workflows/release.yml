---
name: Release

'on':
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag to publish, for example v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from the main branch."
            echo "Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version and changelog entry
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version tag: $VERSION"
            exit 1
          fi

          bare_version="${VERSION#v}"

          BARE_VERSION="$bare_version" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["BARE_VERSION"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          header = re.compile(rf"^## \\[{re.escape(version)}\\] - .+$")
          start = next((i for i, line in enumerate(lines) if header.match(line)), None)

          if start is None:
              raise SystemExit(f"No CHANGELOG.md entry found for {version}")

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].startswith("## ["):
                  end = i
                  break

          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md entry for {version} is empty")

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION"
            exit 1
          fi

      - name: Publish tag and GitHub Release from main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            --target main \
            --title "$VERSION" \
            --notes-file release-notes.md
