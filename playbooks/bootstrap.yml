---
- name: Reset bootstrap target SSH host keys on the controller
  hosts: "{{ bootstrap_host }}"
  gather_facts: false
  roles:
    - controller_known_hosts

- name: Bootstrap SSH key authentication
  hosts: "{{ bootstrap_host }}"
  become: "{{ ansible_user != 'root' }}"

  vars:
    ansible_password: "{{ vault_ansible_password }}"
    ansible_become_pass: "{{ vault_ansible_become_pass }}"

  roles:
    - ssh_security
    - cloudflare_dns
    - controller_ssh_config
