---
- name: Clear controller SSH host fingerprints before bootstrap
  hosts: "{{ bootstrap_host }}"
  gather_facts: false
  roles:
    - role: controller_known_hosts
      when: not (bootstrap_auto_mode | default(false) | bool)

- name: Bootstrap server
  hosts: "{{ bootstrap_host }}"
  become: "{{ ansible_user != 'root' }}"
  # Preserve the traditional one-at-a-time manual Bootstrap. Imported
  # Auto Bootstrap selects a single, unrestricted batch containing all
  # verified new hosts; controller SSH config is then written once.
  serial: "{{ '100%' if (bootstrap_auto_mode | default(false) | bool) else 1 }}"
  vars_files:
    - vars/bootstrap-marker.yml

  vars:
    # A verified key-only auto-candidate must not receive the Vault login password.
    # Existing password-based and manual Bootstrap remain unchanged.
    ansible_password: >-
      {{
        none
        if (bootstrap_auto_mode | default(false) | bool)
        and (bootstrap_auto_auth_method | default('password')) == 'key'
        else vault_ansible_password
      }}
    ansible_become_pass: "{{ vault_ansible_become_pass }}"
    system_update_reboot: true

  # Finish access/bootstrap provisioning before the potentially rebooting OS upgrade.
  roles:
    - ssh_security
    - cloudflare_dns
    - controller_ssh_config

  tasks:
    # Flush SSH security restarts before the final (potentially rebooting)
    # system update. Otherwise a notified handler could run after it.
    - name: Apply pending SSH handlers before final OS upgrade
      ansible.builtin.meta: flush_handlers

    - name: Reset controller connection after SSH hardening
      ansible.builtin.meta: reset_connection

    - name: Confirm SSH reconnection before final OS upgrade
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 2
        timeout: 120

    - name: Perform system update as final bootstrap operation
      ansible.builtin.include_role:
        name: system_update

    - name: Record completion after OS update and any required reboot
      ansible.builtin.copy:
        dest: "{{ bootstrap_marker_path }}"
        content: "{{ bootstrap_marker_content }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
