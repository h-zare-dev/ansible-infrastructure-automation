---
# In-memory selection only; the existing inventory file is never rewritten.
- name: Discover bootstrap status on every inventory host
  hosts: all
  gather_facts: false
  # Match site.yml: operate on all inventory hosts in the same Ansible play.
  # No serial batches; Ansible's existing forks setting controls workers.
  vars_files:
    - vars/bootstrap-marker.yml
  tasks:
    - name: Check marker and hardening with key-only SSH
      ansible.builtin.raw: "{{ bootstrap_probe_command }}"
      become: false
      vars:
        ansible_password: ""
        ansible_ssh_extra_args: >-
          -o ControlMaster=no -o ControlPath=none -o BatchMode=yes
          -o PreferredAuthentications=publickey -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no -o ConnectTimeout=8
      register: bootstrap_auto_key_probe
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      no_log: true

    - name: Parse key-only SSH probe response
      ansible.builtin.set_fact:
        bootstrap_auto_key_code: >-
          {{ (bootstrap_auto_key_probe.stdout_lines | default([]) | last | default('') | trim)
             if (bootstrap_auto_key_probe.rc | default(1) | int == 0) else '' }}

    - name: Check hosts without working key-based access using initial password
      ansible.builtin.raw: "{{ bootstrap_probe_command }}"
      become: false
      vars:
        ansible_password: "{{ vault_ansible_password }}"
        ansible_ssh_extra_args: >-
          -o ControlMaster=no -o ControlPath=none -o BatchMode=no
          -o PreferredAuthentications=password,keyboard-interactive
          -o PubkeyAuthentication=no -o ConnectTimeout=8
      register: bootstrap_auto_password_probe
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      no_log: true
      # A valid key-only probe (including NEW) needs no password attempt.
      # Avoid an expected SSH authentication rejection from being logged as
      # UNREACHABLE before key-authorized fresh hosts can be selected.
      when: bootstrap_auto_key_code == ''

    - name: Parse initial password probe response
      ansible.builtin.set_fact:
        bootstrap_auto_password_code: >-
          {{ (bootstrap_auto_password_probe.stdout_lines | default([]) | last | default('') | trim)
             if (bootstrap_auto_password_probe.rc | default(1) | int == 0) else '' }}

    - name: Verify configured Ansible public key is already authorized for key-only hosts
      ansible.builtin.raw: |
        expected={{ lookup('file', vault_ssh_public_key_path).split()[1] | quote }}
        if [ -r "$HOME/.ssh/authorized_keys" ]; then
          awk -v expected="$expected" '
            { for (i = 1; i <= NF; i++) if ($i == expected) found = 1 }
            END { print found ? "KEY_MATCH" : "KEY_UNKNOWN" }
          ' "$HOME/.ssh/authorized_keys"
        else
          printf '%s\n' KEY_UNKNOWN
        fi
      become: false
      vars:
        ansible_password: ""
        ansible_ssh_extra_args: >-
          -o ControlMaster=no -o ControlPath=none -o BatchMode=yes
          -o PreferredAuthentications=publickey -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no -o ConnectTimeout=8
      register: bootstrap_auto_authorized_key_probe
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      no_log: true
      when:
        - bootstrap_auto_key_code == 'NEW'
        - bootstrap_auto_password_code != 'NEW'

    - name: Parse authorized-key verification result
      ansible.builtin.set_fact:
        bootstrap_auto_verified_key_code: >-
          {{ (bootstrap_auto_authorized_key_probe.stdout_lines | default([]) | last | default('') | trim)
             if (bootstrap_auto_authorized_key_probe.rc | default(1) | int == 0) else '' }}

    - name: Classify host without changing it
      ansible.builtin.set_fact:
        bootstrap_auto_status: >-
          {{ 'managed' if bootstrap_auto_key_code == 'MARKED'
             else 'invalid_marker' if 'INVALID' in [bootstrap_auto_key_code, bootstrap_auto_password_code]
             else 'needs_adoption' if 'HARDENED' in [bootstrap_auto_key_code, bootstrap_auto_password_code]
             else 'review_hardening' if 'HARDENING_UNKNOWN' in [bootstrap_auto_key_code, bootstrap_auto_password_code]
             else 'managed_key_unavailable' if bootstrap_auto_password_code == 'MARKED'
             else 'candidate' if bootstrap_auto_password_code == 'NEW'
             else 'candidate_key' if bootstrap_auto_key_code == 'NEW' and bootstrap_auto_verified_key_code == 'KEY_MATCH'
             else 'key_only_unmanaged' if bootstrap_auto_key_code == 'NEW'
             else 'unreachable' }}

    - name: Choose bootstrap authentication for this host
      ansible.builtin.set_fact:
        bootstrap_auto_auth_method: "{{ 'key' if bootstrap_auto_status == 'candidate_key' else 'password' }}"

    - name: Display discovery result without secrets
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ bootstrap_auto_status }}"

    - name: Group status in memory for summary
      ansible.builtin.group_by:
        key: "__bootstrap_auto_status_{{ bootstrap_auto_status }}"
      changed_when: false

    - name: Add positively verified fresh hosts to ephemeral bootstrap target
      ansible.builtin.group_by:
        key: __bootstrap_auto_pending
      changed_when: false
      when:
        - bootstrap_auto_status in ['candidate', 'candidate_key']
        - not (bootstrap_auto_discover_only | bool)

# Reuse the manually tested Bootstrap workflow without repeating its roles.
- name: Reuse manual Bootstrap on selected fresh hosts
  ansible.builtin.import_playbook: bootstrap.yml
  vars:
    # When discovery finds no new hosts, avoid referring to a nonexistent
    # runtime group. The valid empty intersection keeps all SSH/OS roles
    # skipped without hiding real inventory host-pattern warnings.
    bootstrap_host: >-
      {{ '__bootstrap_auto_pending'
         if (groups.get('__bootstrap_auto_pending', []) | length > 0)
         else 'all:!all' }}
    bootstrap_auto_mode: true

- name: Report discovery issues after the selected hosts finish
  hosts: all
  gather_facts: false
  vars_files:
    - vars/bootstrap-marker.yml
  tasks:
    - name: Show host classifications  # noqa: run-once[task]
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.debug:
        msg:
          managed: "{{ groups.get('__bootstrap_auto_status_managed', []) | sort }}"
          fresh: "{{ groups.get('__bootstrap_auto_status_candidate', []) | sort }}"
          fresh_with_key: "{{ groups.get('__bootstrap_auto_status_candidate_key', []) | sort }}"
          needs_adoption: "{{ groups.get('__bootstrap_auto_status_needs_adoption', []) | sort }}"
          invalid_marker: "{{ groups.get('__bootstrap_auto_status_invalid_marker', []) | sort }}"
          hardening_review: "{{ groups.get('__bootstrap_auto_status_review_hardening', []) | sort }}"
          key_auth_failure: "{{ groups.get('__bootstrap_auto_status_managed_key_unavailable', []) | sort }}"
          key_only_unmanaged: "{{ groups.get('__bootstrap_auto_status_key_only_unmanaged', []) | sort }}"
          unreachable: "{{ groups.get('__bootstrap_auto_status_unreachable', []) | sort }}"
          discovery_only: "{{ bootstrap_auto_discover_only | bool }}"

    - name: Fail rather than silently accept unresolved inventory hosts  # noqa: run-once[task]
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.assert:
        that:
          - groups.get('__bootstrap_auto_status_needs_adoption', []) | length == 0
          - groups.get('__bootstrap_auto_status_invalid_marker', []) | length == 0
          - groups.get('__bootstrap_auto_status_review_hardening', []) | length == 0
          - groups.get('__bootstrap_auto_status_managed_key_unavailable', []) | length == 0
          - groups.get('__bootstrap_auto_status_key_only_unmanaged', []) | length == 0
          - groups.get('__bootstrap_auto_status_unreachable', []) | length == 0
        fail_msg: >-
          Some hosts could not safely be auto-bootstrapped. See their status
          above and docs/auto-bootstrap.md for controlled recovery.
      when: not (bootstrap_auto_discover_only | bool)
