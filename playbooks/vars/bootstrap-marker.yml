---
bootstrap_marker_path: /var/lib/ansible-bootstrap-complete
bootstrap_marker_content: "completed\n"
bootstrap_hardening_path: /etc/ssh/sshd_config.d/00-security-hardening.conf
bootstrap_auto_discover_only: false
bootstrap_adopt_dry_run: false

# Read-only POSIX shell probe, safe on machines without Python.
bootstrap_probe_command: |
  if [ -e /var/lib/ansible-bootstrap-complete ] || [ -L /var/lib/ansible-bootstrap-complete ]; then
    if [ ! -L /var/lib/ansible-bootstrap-complete ] &&
       [ -f /var/lib/ansible-bootstrap-complete ] &&
       [ "$(cat /var/lib/ansible-bootstrap-complete 2>/dev/null)" = completed ]; then
      printf '%s\n' MARKED
    else
      printf '%s\n' INVALID
    fi
  elif [ -e /etc/ssh/sshd_config.d/00-security-hardening.conf ] || [ -L /etc/ssh/sshd_config.d/00-security-hardening.conf ]; then
    if [ -f /etc/ssh/sshd_config.d/00-security-hardening.conf ] &&
       grep -Eq '^[[:space:]]*PasswordAuthentication[[:space:]]+no[[:space:]]*$' /etc/ssh/sshd_config.d/00-security-hardening.conf &&
       grep -Eq '^[[:space:]]*PubkeyAuthentication[[:space:]]+yes[[:space:]]*$' /etc/ssh/sshd_config.d/00-security-hardening.conf; then
      printf '%s\n' HARDENED
    else
      printf '%s\n' HARDENING_UNKNOWN
    fi
  else
    printf '%s\n' NEW
  fi
