---
- name: Configure managed servers
  hosts: all
  become: true
  gather_facts: true
  roles:
    - ssh_security
    - controller_ssh_config
    - cloudflare_dns
    - hostname
    - dns_resolver
    - base_packages
    - speedtest_cli
    - floatip_manager
    - monitoring

- name: Configure PasarGuard nodes
  hosts: pasarguard_nodes
  become: true
  gather_facts: false
  roles:
    - docker
    - pasarguard
    - pasarguard_watchdog
    - role: abuse_firewall
      when: "'abuse_protected' in group_names"
