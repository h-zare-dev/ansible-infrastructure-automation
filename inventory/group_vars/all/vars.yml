---
# General configuration
domain_suffix: "{{ vault_domain_suffix }}"

# Controller output paths
monitoring_targets_dir: "/opt/monitoring/targets"
pasarguard_cert_destination_dir: "/opt/pasarguard/certs"

# Default SSH connection profile
ansible_user: root
ansible_become: false

# Secrets loaded from Ansible Vault
cf_api_token: "{{ vault_cf_api_token }}"
common_api_key: "{{ vault_common_api_key }}"
