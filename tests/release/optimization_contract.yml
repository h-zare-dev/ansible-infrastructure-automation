---
- name: Qualify optimization capacity calculations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/optimization/defaults/main.yml
  vars:
    optimization_live_sysctl:
      net.core.somaxconn: 4096
      net.core.netdev_max_backlog: 1000
      net.core.rmem_max: 8388608
      net.core.wmem_max: 8388608
      net.core.rmem_default: 212992
      net.core.wmem_default: 212992
      net.core.optmem_max: 20480
      net.ipv4.tcp_max_syn_backlog: 4096
      net.netfilter.nf_conntrack_max: 131072
      net.netfilter.nf_conntrack_buckets: 32768
      fs.file-max: 1048576
      fs.nr_open: 1048576
      vm.max_map_count: 65530
      net.ipv4.tcp_min_snd_mss: 536

    optimization_tcp_rmem_live:
      - 4096
      - 131072
      - 6291456

    optimization_tcp_wmem_live:
      - 4096
      - 16384
      - 4194304

    optimization_cases:
      - name: small
        memtotal_mb: 1024
        expected_tier: S
      - name: medium
        memtotal_mb: 4096
        expected_tier: M
      - name: large
        memtotal_mb: 16384
        expected_tier: L
      - name: extra-large
        memtotal_mb: 32768
        expected_tier: XL
      - name: workload-capped
        memtotal_mb: 4096
        expected_tier: M
        expected_users: 200000

  tasks:
    - name: Exercise every optimization capacity tier
      ansible.builtin.include_tasks:
        file: optimization_case.yml
      loop: "{{ optimization_cases }}"
      loop_control:
        loop_var: optimization_case
        label: "{{ optimization_case.name }}"

    - name: Assert workload-aware conntrack ceiling remains bounded
      ansible.builtin.assert:
        that:
          - optimization_conntrack_max | int <= 4194304
