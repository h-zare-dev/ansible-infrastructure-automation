---
# Intentionally clears ALL host-key fingerprints for the Ansible controller user
# at the start of each bootstrap, not just entries for bootstrap_host.
# Never touches remote authorized_keys, local private keys or SSH config.
- name: Clear controller SSH known_hosts before bootstrap
  delegate_to: localhost
  become: false
  run_once: true
  block:
    - name: Ensure controller SSH directory exists
      ansible.builtin.file:
        path: "{{ controller_known_hosts_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Empty the entire controller known_hosts file
      ansible.builtin.copy:
        dest: "{{ controller_known_hosts_path }}"
        content: ""
        mode: "0600"
