---
system_update_reboot: false
system_update_reboot_timeout: 600
system_update_connect_timeout: 10
system_update_post_reboot_delay: 10
# Read-only BIOS GRUB inspection and safe debconf target correction before apt dist-upgrade.
# Fail closed for ambiguous firmware boot disks. No automatic grub-install is run.
system_update_grub_preflight_enabled: true
