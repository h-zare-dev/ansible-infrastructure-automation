---
# Resolve the newest published, non-prerelease GitHub Release at runtime.
# Never execute upstream installers or install portfw-migrate/legacy binaries.
port_forward_manager_release_delegate: localhost
port_forward_manager_latest_release_url: https://api.github.com/repos/h-zare-dev/iptables-forward-manager/releases/latest
port_forward_manager_raw_base_url: https://raw.githubusercontent.com/h-zare-dev/iptables-forward-manager
port_forward_manager_bin_path: /usr/local/bin/portfw-nft
port_forward_manager_service_path: /etc/systemd/system/portfw-nft.service
port_forward_manager_state_dir: /etc/iptables-forward-manager
port_forward_manager_dns_service_path: /etc/systemd/system/portfw-dns-refresh.service
port_forward_manager_dns_timer_path: /etc/systemd/system/portfw-dns-refresh.timer
