---
# Look up the latest published, non-prerelease GitHub Release once per play.
# Only when a stable release is missing (HTTP 404), use the reviewed fallback.
# Track selected refs to ensure changed releases replace older binaries.
floatip_manager_release_delegate: localhost
floatip_manager_latest_release_url: https://api.github.com/repos/h-zare-dev/floatip-manager/releases/latest
floatip_manager_raw_base_url: https://raw.githubusercontent.com/h-zare-dev/floatip-manager
floatip_manager_fallback_ref: "e541e59816647df25c771630e35c63eca532bde7"
floatip_manager_path: "/usr/local/sbin/floatip"
floatip_manager_installed_ref_path: "/usr/local/sbin/.floatip-manager-installed-ref"
