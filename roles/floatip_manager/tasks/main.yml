---
- name: Detect Hetzner targets before querying FloatIP releases
  ansible.builtin.set_fact:
    floatip_manager_hetzner_present: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars, 'ansible_facts')
        | map(attribute='system_vendor', default='')
        | select('search', '(?i)hetzner')
        | list
        | length > 0
      }}
  run_once: true

- name: Resolve latest stable FloatIP Manager release on controller
  ansible.builtin.uri:
    url: "{{ floatip_manager_latest_release_url }}"
    return_content: true
    status_code:
      - 200
      - 404
    headers:
      Accept: application/vnd.github+json
  delegate_to: "{{ floatip_manager_release_delegate }}"
  become: false
  run_once: true
  register: floatip_manager_release_response
  check_mode: false
  changed_when: false
  when: floatip_manager_hetzner_present | bool

- name: Validate stable FloatIP Manager release tag
  ansible.builtin.assert:
    that:
      - floatip_manager_release_response.json.tag_name is defined
      - floatip_manager_release_response.json.tag_name is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
      - not (floatip_manager_release_response.json.draft | default(true) | bool)
      - not (floatip_manager_release_response.json.prerelease | default(true) | bool)
    fail_msg: GitHub latest FloatIP release is not a stable vMAJOR.MINOR.PATCH tag.
  run_once: true
  when:
    - floatip_manager_hetzner_present | bool
    - floatip_manager_release_response.status | int == 200

- name: Use pinned FloatIP fallback until first stable Release is available
  ansible.builtin.debug:
    msg: >-
      FloatIP Manager has no published stable GitHub Release (HTTP 404).
      Installing the pinned, reviewed fallback commit
      {{ floatip_manager_fallback_ref }} instead.
  run_once: true
  when:
    - floatip_manager_hetzner_present | bool
    - floatip_manager_release_response.status | int == 404

- name: Set selected FloatIP Manager artifact reference for Hetzner hosts
  ansible.builtin.set_fact:
    floatip_manager_selected_ref: >-
      {{
        floatip_manager_release_response.json.tag_name
        if floatip_manager_release_response.status | int == 200
        else floatip_manager_fallback_ref
      }}
  when: "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"

- name: Check installed FloatIP Manager executable
  ansible.builtin.stat:
    path: "{{ floatip_manager_path }}"
  register: floatip_manager_existing_binary
  when: "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"

- name: Check previously installed FloatIP Manager release reference
  ansible.builtin.stat:
    path: "{{ floatip_manager_installed_ref_path }}"
  register: floatip_manager_existing_ref_file
  when: "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"

- name: Read previously installed FloatIP Manager release reference
  ansible.builtin.slurp:
    src: "{{ floatip_manager_installed_ref_path }}"
  register: floatip_manager_existing_ref_content
  when:
    - "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"
    - floatip_manager_existing_ref_file.stat.exists

- name: Resolve currently installed FloatIP Manager release reference
  ansible.builtin.set_fact:
    floatip_manager_existing_ref: >-
      {{
        (floatip_manager_existing_ref_content.content | b64decode | trim)
        if floatip_manager_existing_ref_file.stat.exists
        else ''
      }}
  when: "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"

- name: Install latest stable FloatIP Manager CLI on Hetzner hosts only
  ansible.builtin.get_url:
    url: "{{ floatip_manager_raw_base_url }}/{{ floatip_manager_selected_ref }}/floatip"
    dest: "{{ floatip_manager_path }}"
    owner: root
    group: root
    mode: "0755"
    # get_url can retain a previous artifact when remote URLs have matching
    # timestamps/headers. Force replacement on an actual selected-ref change.
    force: >-
      {{
        not floatip_manager_existing_binary.stat.exists
        or floatip_manager_existing_ref != floatip_manager_selected_ref
      }}
  when: "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"

- name: Validate installed FloatIP Manager Bash syntax
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - "{{ floatip_manager_path }}"
  changed_when: false
  when:
    - "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"
    - not ansible_check_mode

- name: Record successfully installed FloatIP Manager release reference
  ansible.builtin.copy:
    dest: "{{ floatip_manager_installed_ref_path }}"
    content: "{{ floatip_manager_selected_ref }}\n"
    owner: root
    group: root
    mode: "0644"
  when:
    - "'hetzner' in (ansible_facts.system_vendor | default('') | lower)"
    - not ansible_check_mode
