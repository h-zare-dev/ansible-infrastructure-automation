---
- name: Ensure controller backup is executed by root
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.env', 'HOME') == '/root')
    fail_msg: Run this local backup as root on the Ansible controller.

- name: Create encrypted controller backup and optionally send to Telegram
  ansible.builtin.command:
    argv: >-
      {{
        [
          'python3',
          playbook_dir ~ '/../../scripts/controller_manager.py',
          'backup'
        ] + (['--upload'] if (controller_backup_upload | bool) else [])
      }}
  changed_when: true
  when: not ansible_check_mode
