---
- name: Read and validate critical live sysctl values
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - "{{ item.key }}"
  loop: "{{ optimization_verify_sysctls | dict2items }}"
  register: optimization_verify_results
  changed_when: false
  check_mode: false
  failed_when: >-
    optimization_verify_results.rc != 0 or
    (optimization_verify_results.stdout | trim) != (item.value | string)
  loop_control:
    label: "{{ item.key }} (expected={{ item.value }})"
  vars:
    optimization_verify_sysctls:
      net.core.default_qdisc: "{{ optimization_default_qdisc }}"
      net.ipv4.tcp_congestion_control: "{{ optimization_congestion_control }}"
      net.core.somaxconn: "{{ optimization_somaxconn }}"
      net.ipv4.tcp_max_syn_backlog: "{{ optimization_tcp_max_syn_backlog }}"
      net.core.netdev_max_backlog: "{{ optimization_netdev_backlog }}"
      net.core.rmem_max: "{{ optimization_rmem_max }}"
      net.core.wmem_max: "{{ optimization_wmem_max }}"
      net.ipv4.tcp_mtu_probing: "1"
      net.ipv4.ip_forward: "1"
      net.netfilter.nf_conntrack_max: "{{ optimization_conntrack_max }}"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.default.rp_filter: "2"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.all.accept_source_route: "0"
      fs.file-max: "{{ optimization_file_max }}"
      fs.nr_open: "{{ optimization_nr_open }}"
      vm.max_map_count: "{{ optimization_max_map_count }}"

- name: Capture default IPv4 route after tuning
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - route
      - show
      - default
  register: optimization_route_after
  changed_when: false

- name: Capture canonical IPv4 address set after tuning
  ansible.builtin.shell: |
    set -o pipefail
    ip -4 -o addr show dev "{{ optimization_default_iface }}" |
      awk '{print $4}' |
      sort -u
  args:
    executable: /bin/bash
  register: optimization_addresses_after
  changed_when: false

- name: Capture active qdisc after tuning
  ansible.builtin.command:
    argv:
      - tc
      - qdisc
      - show
      - dev
      - "{{ optimization_default_iface }}"
  register: optimization_qdisc_after
  changed_when: false
  failed_when: false

- name: Capture resolver file state after tuning
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: true
    get_checksum: true
  register: optimization_resolv_after

- name: Capture running Docker containers after tuning
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - -q
  register: optimization_docker_after
  changed_when: false
  failed_when: false
  when: optimization_docker_command.rc == 0

- name: Assert networking identity and resolver were not changed
  ansible.builtin.assert:
    that:
      - optimization_route_after.stdout == optimization_route_before.stdout
      - optimization_addresses_after.stdout_lines == optimization_addresses_before.stdout_lines
      - >-
        (optimization_resolv_before.stat.checksum | default('')) ==
        (optimization_resolv_after.stat.checksum | default(''))
      - >-
        optimization_live_qdisc_replace | bool or
        optimization_qdisc_after.stdout == optimization_qdisc_before.stdout
    fail_msg: >-
      Optimization changed the default route, interface IPv4 address set,
      resolver, or live qdisc unexpectedly. IPv4 before={{ optimization_addresses_before.stdout_lines | join(',') }};
      after={{ optimization_addresses_after.stdout_lines | join(',') }}. Stop before applying to additional hosts.

- name: Assert Docker containers were not restarted
  ansible.builtin.assert:
    that:
      - >-
        (optimization_docker_after.stdout_lines | default([]) | sort) ==
        (optimization_docker_before.stdout_lines | default([]) | sort)
    fail_msg: "The running Docker container set changed during optimization."
  when: optimization_docker_command.rc == 0

- name: Confirm Ansible can still reach the host
  ansible.builtin.wait_for_connection:
    timeout: 15
