---
- name: Apply optimization sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Reexecute systemd manager
  ansible.builtin.command:
    argv:
      - systemctl
      - daemon-reexec
  changed_when: true

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
