[defaults]
roles_path = ./roles
# Inherit default stdout behavior and print neutral fallback messages only
# for optional Auto Bootstrap SSH probes; all actual failures stay visible.
callback_plugins = ./callback_plugins
stdout_callback = quiet_bootstrap_auth
callbacks_enabled = pasarguard_certificate_output
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent


