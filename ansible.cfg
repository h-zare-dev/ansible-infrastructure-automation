[defaults]
roles_path = ./roles
# Keep the standard stdout callback. Only PasarGuard's public certificate
# inspection tasks get an additional copy-ready, unescaped terminal view.
callback_plugins = ./callback_plugins
callbacks_enabled = pasarguard_certificate_output
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent


